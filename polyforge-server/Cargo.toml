[package]
name = "polyforge-server"
version = "0.1.0"
edition = "2021"
description = "REST API server for the Polyforge trading platform."

[[bin]]
name = "polyforge-server"
path = "src/main.rs"

[dependencies]
polyforge-core   = { path = "../polyforge-core" }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
thiserror        = { workspace = true }
actix-web        = { version = "4", features = ["rustls-0_23"] }
actix-files      = "0.6.6"
actix-web-prom   = "0.9"
prometheus       = "0.13"
axum             = "0.7.4"
chrono           = "0.4.37"
config           = "0.15.13"
dotenv           = "0.15.0"
env_logger       = "0.11.3"   # kept for transitive compat; logging via tracing
log              = "0.4"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
tracing-actix-web = "0.7"
hyper            = "0.14"
jsonwebtoken     = "9.3.0"
lazy_static      = "1.4.0"
rustls-pemfile   = "2.2.0"
rustls           = { version = "0.23.29", features = ["ring"] }
sea-orm          = { version = "0.12", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
migration        = { path = "migration" }
sha256           = "1.5.0"
tower            = { version = "0.5.2", features = ["full"] }
tokio-rustls     = "0.23.4"
rustls-pki-types = "1.12.0"
reqwest          = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait      = "0.1"
tokio-stream     = { version = "0.1", features = ["sync"] }
yahoo-finance-rs  = { version = "0.1", default-features = false, features = ["rustls-tls"] }

[package.metadata.sea-orm]
debug = true
