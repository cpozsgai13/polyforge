[workspace]
resolver = "2"
members = [
    "polyforge-core",
    "polyforge-pipeline",
    "polyforge-server",
    "polyforge-client",
]

# Shared dependency versions across all crates
[workspace.dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
tokio       = { version = "1.37", features = ["full"] }
thiserror   = "1.0"
