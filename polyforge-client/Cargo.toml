[package]
name = "polyforge-client"
version = "0.1.0"
edition = "2021"
description = "CLI trading client for the Polyforge platform — sends orders to polyforge-server over HTTPS."

[[bin]]
name = "polyforge-client"
path = "src/main.rs"

[dependencies]
polyforge-core = { path = "../polyforge-core" }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true }
reqwest        = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
